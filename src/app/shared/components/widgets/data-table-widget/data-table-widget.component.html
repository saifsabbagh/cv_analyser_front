@if (loading()) {
  <div class="table-widget">
    @if (title()) {
      <h3 class="table-widget-title">{{ title() }}</h3>
    }
    <div class="table-skeleton">
      @for (row of [1,2,3,4,5]; track row) {
        <div class="skeleton-row">
          @for (col of [1,2,3]; track col) {
            <div class="skeleton-cell" [style.width.%]="col === 1 ? 40 : col === 2 ? 20 : 25"></div>
          }
        </div>
      }
    </div>
  </div>
} @else if (!data() || data().length === 0) {
  <div class="table-widget">
    @if (title()) {
      <h3 class="table-widget-title">{{ title() }}</h3>
    }
    <div class="table-empty">
      <svg class="table-empty-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z" />
      </svg>
      <p>{{ emptyMessage() }}</p>
    </div>
  </div>
} @else {
  <div class="table-widget">
    @if (title()) {
      <h3 class="table-widget-title">{{ title() }}</h3>
    }
    <dx-data-grid
      [dataSource]="data()"
      [columns]="columns()"
      [showBorders]="false"
      [showRowLines]="true"
      [hoverStateEnabled]="true"
      [rowAlternationEnabled]="false"
      class="data-grid-instance"
    >
      <dxo-paging [enabled]="false" />
      <dxo-pager [visible]="false" />
      <dxo-filter-row [visible]="false" />
      <dxo-search-panel [visible]="false" />
      <dxo-header-filter [visible]="false" />
      <dxo-sorting [mode]="'single'" />
      <dxo-column-chooser [enabled]="false" />
    </dx-data-grid>
  </div>
}
