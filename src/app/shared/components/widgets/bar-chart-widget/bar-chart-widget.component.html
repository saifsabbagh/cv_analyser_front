@if (loading()) {
  <div class="chart-widget">
    @if (title()) {
      <h3 class="chart-widget-title">{{ title() }}</h3>
    }
    <div class="chart-skeleton">
      <div class="skeleton-bars">
        @for (bar of [1,2,3,4,5,6]; track bar) {
          <div class="skeleton-bar" [style.height.px]="30 + bar * 8"></div>
        }
      </div>
    </div>
  </div>
} @else if (!data() || data().length === 0) {
  <div class="chart-widget">
    @if (title()) {
      <h3 class="chart-widget-title">{{ title() }}</h3>
    }
    <div class="chart-empty">
      <svg class="chart-empty-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
      </svg>
      <p>{{ emptyMessage() }}</p>
    </div>
  </div>
} @else {
  <div class="chart-widget">
    @if (title()) {
      <h3 class="chart-widget-title">{{ title() }}</h3>
    }
    <dx-chart
      [dataSource]="data()"
      class="bar-chart-instance"
    >
      <dxi-series
        [argumentField]="argumentField()"
        [valueField]="valueField()"
        type="bar"
      />
      <dxo-legend [visible]="false" />
      <dxo-tooltip [enabled]="true" />
    </dx-chart>
  </div>
}
