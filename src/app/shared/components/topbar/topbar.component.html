<header class="topbar">
  <!-- Left section -->
  <div class="flex items-center gap-3">
    <!-- Hamburger (mobile) -->
    <button
      (click)="onMenuToggle()"
      class="topbar-hamburger lg:hidden"
      aria-label="Ouvrir le menu"
    >
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7" />
      </svg>
    </button>

    <!-- Page Title -->
    @if (pageTitle()) {
      <h1 class="text-lg font-semibold text-text hidden sm:block">{{ pageTitle() }}</h1>
    }
  </div>

  <!-- Search bar (desktop) -->
  <div class="hidden md:flex relative flex-1 max-w-md mx-4">
    <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-text-secondary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
    </svg>
    <input
      type="text"
      placeholder="Rechercher un CV ou une offre..."
      class="topbar-search-input"
    />
  </div>

  <!-- Right section -->
  <div class="flex items-center gap-2 ml-auto">
    <!-- Search icon (mobile) -->
    <button class="topbar-icon-btn md:hidden" aria-label="Rechercher">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
      </svg>
    </button>

    <!-- Notifications -->
    <button class="topbar-icon-btn relative" aria-label="Notifications">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
      </svg>
      <span class="topbar-badge">3</span>
    </button>

    <!-- Theme Toggle -->
    <app-theme-toggle />

    <!-- User Avatar & Info -->
    @if (currentUser$ | async; as user) {
      <div class="hidden sm:flex items-center gap-3 pl-3 border-l border-border">
        <div class="w-8 h-8 rounded-full bg-primary text-white flex items-center justify-center text-sm font-semibold flex-shrink-0">
          {{ getUserInitials(user.name) }}
        </div>
        <div class="flex flex-col leading-tight">
          <span class="text-sm font-medium text-text">{{ user.name }}</span>
          <span class="text-xs text-text-secondary">{{ getUserRoleLabel(user.role) }}</span>
        </div>
      </div>
    }
  </div>
</header>
