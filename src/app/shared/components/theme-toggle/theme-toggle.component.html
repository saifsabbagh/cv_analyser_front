<button (click)="themeService.toggle()"
        class="theme-toggle-btn flex items-center justify-center p-2 rounded-lg transition-all duration-200 border-0 cursor-pointer bg-transparent hover:bg-slate-100 dark:hover:bg-slate-800"
        [attr.aria-label]="themeService.theme() === 'dark' ? 'Activer le mode clair' : 'Activer le mode sombre'">
  <!-- Sun Icon (shown in dark mode to switch to light) -->
  <svg *ngIf="themeService.theme() === 'dark'"
       class="w-5 h-5 text-yellow-400 hover:text-yellow-300 hover:scale-110 transition-transform"
       fill="none" stroke="currentColor" viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M12 3v1m0 16v1m9-9h-1M4 9H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m0-12.728l.707.707m12.728 12.728l.707.707M12 8a4 4 0 100 8 4 4 0 000-8z" />
  </svg>
  <!-- Moon Icon (shown in light mode to switch to dark) -->
  <svg *ngIf="themeService.theme() === 'light'"
       class="w-5 h-5 text-slate-700 hover:text-[#1B2A4A] hover:scale-110 transition-transform"
       fill="none" stroke="currentColor" viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
  </svg>
</button>
