<aside
  [class.translate-x-0]="isOpen()"
  [class.-translate-x-full]="!isOpen()"
  class="fixed left-0 top-0 h-full w-60 z-30 flex flex-col bg-surface border-r border-border transition-transform duration-300 lg:translate-x-0"
>
  <!-- Logo & Tagline -->
  <div class="px-5 pt-6 pb-4">
    <a routerLink="/candidate/dashboard" class="flex items-center gap-2 no-underline" (click)="onClose()">
      <span class="text-xl font-bold text-primary">📊 CV Intelligence</span>
    </a>
    <p class="text-xs text-text-secondary mt-1">Analyse & Matching</p>
  </div>

  <!-- Navigation Menu -->
  <nav class="flex-1 px-3 space-y-1 overflow-y-auto">
    @for (item of mainMenuItems; track item.route) {
      <a
        [routerLink]="item.route"
        routerLinkActive="sidebar-item-active"
        [routerLinkActiveOptions]="{ exact: false }"
        (click)="onClose()"
        class="sidebar-item"
      >
        <span class="sidebar-item-icon">
          @switch (item.icon) {
            @case ('dashboard') {
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
              </svg>
            }
            @case ('document') {
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
              </svg>
            }
            @case ('briefcase') {
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
              </svg>
            }
            @case ('target') {
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
              </svg>
            }
            @case ('user') {
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
              </svg>
            }
          }
        </span>
        <span>{{ item.label }}</span>
      </a>
    }
  </nav>

  <!-- Bottom Section -->
  <div class="px-3 pb-6 pt-4 border-t border-border mt-auto space-y-2">
    <!-- Analyser un CV -->
    <a
      routerLink="/candidate/cv"
      (click)="onClose()"
      class="flex items-center gap-2 px-4 py-2.5 rounded-lg bg-primary text-white text-sm font-medium hover:bg-primary-hover transition-colors no-underline"
    >
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
      </svg>
      <span>+ Analyser un CV</span>
    </a>

    <!-- Paramètres -->
    <a
      routerLink="/candidate/profile"
      (click)="onClose()"
      class="sidebar-item"
    >
      <span class="sidebar-item-icon">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
      </span>
      <span>Paramètres</span>
    </a>

    <!-- Theme Toggle + Déconnexion row -->
    <div class="flex items-center justify-between pt-1">
      <app-theme-toggle />
      <button
        (click)="onLogout()"
        class="flex items-center gap-2 px-3 py-2 text-sm text-text-secondary hover:text-error transition-colors bg-transparent border-0 cursor-pointer rounded-lg hover:bg-surface-alt"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
        </svg>
        <span>Déconnexion</span>
      </button>
    </div>
  </div>
</aside>
