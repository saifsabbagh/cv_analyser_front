<div class="page-container">
  <!-- Header -->
  <div class="page-header">
    <a routerLink="/candidate/cv" class="back-link">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
      </svg>
      Retour
    </a>
    <h1 class="page-title">Analyser un CV</h1>
    <p class="page-subtitle">Importez votre CV au format PDF pour extraire automatiquement vos compétences.</p>
  </div>

  <!-- Upload Card -->
  <div class="upload-card">
    <div class="upload-zone">
      <dx-file-uploader
        selectButtonText="Choisir un fichier"
        labelText="ou déposez votre CV ici"
        accept=".pdf"
        uploadMode="useForm"
        (onValueChanged)="onFileSelected($event)"
      >
      </dx-file-uploader>
      <p class="upload-hint">Format accepté : PDF &middot; Taille max : {{ maxSizeMB }} Mo</p>
    </div>

    <!-- Error -->
    @if (error(); as err) {
      <div class="error-message">
        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span>{{ err }}</span>
      </div>
    }

    <!-- Submit -->
    <button
      class="btn-submit"
      [disabled]="!selectedFile() || uploading()"
      (click)="onSubmit()"
    >
      @if (uploading()) {
        <span class="spinner"></span>
        Analyse en cours...
      } @else {
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        Analyser le CV
      }
    </button>
  </div>
</div>
