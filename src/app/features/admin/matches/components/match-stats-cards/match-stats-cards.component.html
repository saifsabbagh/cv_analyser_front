<div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
  <app-kpi-card
    icon="target"
    label="Matchings Totaux"
    [value]="stats()?.total ?? 0"
    [loading]="loading()"
  />
  <app-kpi-card
    icon="trophy"
    label="Score Moyen"
    [value]="stats() ? (stats()!.avgScore + ' %') : 0"
    accentColor="success"
    [loading]="loading()"
  />
</div>
