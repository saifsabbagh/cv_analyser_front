<form [formGroup]="form" class="filters-bar">
  <!-- Recherche candidat -->
  <div class="filter-search">
    <svg class="filter-search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
    </svg>
    <input
      type="text"
      formControlName="search"
      placeholder="Rechercher un candidat..."
      class="filter-input filter-input--search"
      aria-label="Rechercher un candidat"
    />
  </div>

  <!-- Offre d'emploi -->
  <select formControlName="jobId" class="filter-input" aria-label="Filtrer par offre d'emploi">
    <option [ngValue]="null">Tous les postes</option>
    @for (job of jobs(); track job.id) {
      <option [ngValue]="job.id">{{ job.title }}</option>
    }
  </select>

  <!-- Score min / max -->
  <input
    type="number"
    formControlName="minScore"
    min="0"
    max="100"
    step="1"
    placeholder="Score min"
    class="filter-input filter-input--number"
    aria-label="Score minimum"
  />
  <input
    type="number"
    formControlName="maxScore"
    min="0"
    max="100"
    step="1"
    placeholder="Score max"
    class="filter-input filter-input--number"
    aria-label="Score maximum"
  />

  <!-- Statut d'archivage -->
  <select formControlName="archived" class="filter-input" aria-label="Filtrer par statut">
    <option value="false">Actifs</option>
    <option value="true">Archivés</option>
  </select>

  <!-- Réinitialiser -->
  <button type="button" (click)="resetFilters()" class="filter-reset">
    Réinitialiser les filtres
  </button>
</form>
