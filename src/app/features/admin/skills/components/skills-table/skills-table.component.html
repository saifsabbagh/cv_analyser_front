<div class="skills-table">
  @if (loading()) {
    <div class="table-loading-overlay">
      <div class="table-spinner"></div>
    </div>
  }

  <dx-data-grid
    [dataSource]="dataSource"
    [showBorders]="false"
    [showRowLines]="true"
    [hoverStateEnabled]="true"
    [columnAutoWidth]="true"
    [columnHidingEnabled]="true"
    [remoteOperations]="{ paging: true }"
    (onOptionChanged)="onOptionChanged($event)"
    class="skills-grid"
  >
    <dxo-paging [pageSize]="limit()" [pageIndex]="page() - 1" />
    <dxo-pager
      [visible]="true"
      [showInfo]="true"
      [showNavigationButtons]="true"
      [showPageSizeSelector]="true"
      [allowedPageSizes]="[10, 25, 50]"
      infoText="Page {0} sur {1} ({2} compétences)"
    />
    <dxo-sorting mode="none" />
    <dxo-load-panel [enabled]="false" />

    <dxi-column dataField="name" caption="Nom" cellTemplate="nameCell" [hidingPriority]="4" />
    <dxi-column caption="Usage dans les Offres" cellTemplate="jobUsageCell" [width]="180" [hidingPriority]="2" />
    <dxi-column caption="Usage dans les CVs" cellTemplate="cvUsageCell" [width]="170" [hidingPriority]="1" />
    <dxi-column caption="Actions" cellTemplate="actionsCell" [width]="120" [hidingPriority]="3" />

    <!-- Nom (édition inline) -->
    <div *dxTemplate="let cell of 'nameCell'">
      @if (editingSkillId() === cell.data.id) {
        <input
          type="text"
          class="name-input"
          [value]="cell.data.name"
          (keyup.enter)="confirmEdit(cell.data, $any($event.target).value)"
          (keyup.escape)="cancelEdit()"
          (blur)="confirmEdit(cell.data, $any($event.target).value)"
          aria-label="Modifier le nom de la compétence"
          autofocus
        />
      } @else {
        <span class="skill-name">{{ cell.data.name }}</span>
      }
    </div>

    <!-- Usage offres -->
    <div *dxTemplate="let cell of 'jobUsageCell'">
      <span [class]="getJobUsage(cell.data) > 0 ? 'usage-badge usage-badge--active' : 'usage-badge'">
        {{ getJobUsage(cell.data) }}
      </span>
    </div>

    <!-- Usage CVs -->
    <div *dxTemplate="let cell of 'cvUsageCell'">
      <span [class]="getCvUsage(cell.data) > 0 ? 'usage-badge usage-badge--active' : 'usage-badge'">
        {{ getCvUsage(cell.data) }}
      </span>
    </div>

    <!-- Actions -->
    <div *dxTemplate="let cell of 'actionsCell'" class="cell-actions">
      <button
        type="button"
        class="action-btn"
        (click)="startEdit(cell.data.id)"
        title="Modifier le nom"
        aria-label="Modifier le nom"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
        </svg>
      </button>
      <button
        type="button"
        class="action-btn action-btn--danger"
        (click)="onDelete(cell.data)"
        [disabled]="!isDeletable(cell.data)"
        [title]="isDeletable(cell.data) ? 'Supprimer la compétence' : 'Utilisée, suppression impossible'"
        aria-label="Supprimer la compétence"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
        </svg>
      </button>
    </div>
  </dx-data-grid>
</div>
