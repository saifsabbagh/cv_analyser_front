<div class="space-y-6">
  <!-- En-tête -->
  <div class="skills-header">
    <div>
      <h1 class="skills-title">Gestion des compétences</h1>
      <p class="skills-subtitle">Référentiel global utilisé par les offres et les CVs</p>
    </div>
    <button type="button" class="btn-add-skill" (click)="openModal()">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
      </svg>
      <span>Ajouter une compétence</span>
    </button>
  </div>

  <!-- Cartes statistiques -->
  <app-skill-stats-cards [stats]="stats()" [loading]="statsLoading()" />

  <!-- Recherche -->
  <div class="skills-search-bar">
    <div class="search-wrapper">
      <svg class="search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
      </svg>
      <input
        type="text"
        [formControl]="searchControl"
        placeholder="Rechercher une compétence..."
        class="search-input"
      />
    </div>
  </div>

  <!-- Erreur -->
  @if (error(); as err) {
    <div class="error-banner">
      <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <span>{{ err }}</span>
    </div>
  }

  <!-- Tableau -->
  <app-skills-table
    [skills]="skills()"
    [total]="total()"
    [page]="page()"
    [limit]="limit()"
    [loading]="isLoading()"
    (rename)="onRename($event)"
    (remove)="onRemove($event)"
    (pageChange)="onPageChange($event)"
  />

  <!-- Modal création -->
  <app-skill-create-modal
    [visible]="modalVisible()"
    [saving]="saving()"
    (created)="onCreate($event)"
    (closed)="closeModal()"
  />

  <!-- Notifications -->
  <dx-toast
    [visible]="toastVisible()"
    (visibleChange)="toastVisible.set($event)"
    [message]="toastMessage()"
    [type]="toastType()"
    [displayTime]="3000"
  />
</div>
