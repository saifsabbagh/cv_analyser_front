<div class="grid grid-cols-1 md:grid-cols-3 gap-4">
  <app-kpi-card
    icon="users"
    label="Total Utilisateurs"
    [value]="stats()?.total ?? 0"
    [loading]="loading()"
  />
  <app-kpi-card
    icon="users"
    label="Utilisateurs Actifs"
    [value]="stats()?.active ?? 0"
    accentColor="success"
    [loading]="loading()"
  />
  <app-kpi-card
    icon="users"
    label="Comptes Suspendus"
    [value]="stats()?.suspended ?? 0"
    accentColor="warning"
    [loading]="loading()"
  />
</div>
