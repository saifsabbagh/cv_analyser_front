<form [formGroup]="form" class="filters-bar">
  <!-- Recherche -->
  <div class="filter-search">
    <svg class="filter-search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
    </svg>
    <input
      type="text"
      formControlName="search"
      placeholder="Rechercher par nom ou email..."
      class="filter-input filter-input--search"
    />
  </div>

  <!-- Rôle -->
  <select formControlName="role" class="filter-input" aria-label="Filtrer par rôle">
    <option value="">Tous les rôles</option>
    <option value="ADMIN">Admin</option>
    <option value="CANDIDATE">Candidat</option>
  </select>

  <!-- Statut -->
  <select formControlName="isActive" class="filter-input" aria-label="Filtrer par statut">
    <option value="">Tous les statuts</option>
    <option value="true">Actif</option>
    <option value="false">Désactivé</option>
  </select>

  <!-- Réinitialiser -->
  <button type="button" (click)="resetFilters()" class="filter-reset">
    Réinitialiser les filtres
  </button>
</form>
