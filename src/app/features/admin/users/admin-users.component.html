<div class="space-y-6">
  <!-- En-tête -->
  <div class="users-header">
    <div>
      <h1 class="users-title">Gestion des utilisateurs</h1>
      <p class="users-subtitle">Consultez et administrez les comptes de la plateforme</p>
    </div>
    <button
      type="button"
      class="btn-new-user"
      disabled
      title="Bientôt disponible"
    >
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
      </svg>
      <span>Nouvel Utilisateur</span>
    </button>
  </div>

  <!-- Cartes statistiques -->
  <app-user-stats-cards [stats]="stats()" [loading]="statsLoading()" />

  <!-- Filtres -->
  <app-user-filters (filtersChange)="onFiltersChange($event)" />

  <!-- Erreur -->
  @if (error(); as err) {
    <div class="error-banner">
      <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <span>{{ err }}</span>
    </div>
  }

  <!-- Tableau -->
  <app-users-table
    [users]="users()"
    [total]="total()"
    [page]="page()"
    [limit]="limit()"
    [loading]="isLoading()"
    (toggleActive)="onToggleActive($event)"
    (roleChange)="onRoleChange($event)"
    (pageChange)="onPageChange($event)"
  />

  <!-- Notifications -->
  <dx-toast
    [visible]="toastVisible()"
    (visibleChange)="toastVisible.set($event)"
    [message]="toastMessage()"
    [type]="toastType()"
    [displayTime]="3000"
  />
</div>
