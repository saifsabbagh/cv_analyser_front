<div class="auth-bg min-h-screen relative flex items-center justify-center px-4 py-12 overflow-hidden">
  <!-- Indigo Glow Decoration behind card -->
  <div class="glow-decoration absolute bottom-[-100px] left-[-100px] pointer-events-none"></div>
  <div class="glow-decoration absolute top-[-200px] right-[-200px] pointer-events-none opacity-50"></div>

  <!-- Centered Card -->
  <div class="bg-surface rounded-2xl shadow-2xl border border-border/80 w-full max-w-[420px] p-6 sm:p-8 md:p-10 relative z-10">
    <!-- Logo & Header -->
    <div class="text-center">
      <div class="text-4xl text-primary mb-2 filter drop-shadow-[0_0_10px_rgba(99,102,241,0.3)]">📊</div>
      <h1 class="text-xl font-bold text-text tracking-wide">CV Analyzer</h1>
      <p class="text-xs text-text-secondary mt-1">Intelligence Artificielle de Recrutement</p>
    </div>

    <div class="border-t border-border/50 my-6"></div>

    <!-- Alert Messages -->
    <div *ngIf="errorMessage" class="bg-error/10 border border-error/30 text-error rounded-lg p-3 text-sm mb-4 text-center">
      {{ errorMessage }}
    </div>
    <div *ngIf="successMessage && !errorMessage" class="bg-success/10 border border-success/30 text-success rounded-lg p-3 text-sm mb-4 text-center">
      {{ successMessage }}
    </div>

    <!-- Form -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">

      <!-- Email Field -->
      <div>
        <label for="email" class="text-text-secondary text-xs font-semibold uppercase tracking-wider block mb-1.5">
          Email professionnel
        </label>
        <dx-text-box
          id="email"
          mode="email"
          formControlName="email"
          stylingMode="outlined"
          placeholder="nom@entreprise.com"
         
         
          [elementAttr]="{ class: isFieldInvalid('email') ? 'auth-input auth-input-error' : 'auth-input' }"
          [isValid]="!isFieldInvalid('email')">
        </dx-text-box>
        <span *ngIf="isFieldInvalid('email')" class="text-error text-xs mt-1 block">
          {{ getFieldError('email') }}
        </span>
      </div>

      <!-- Password Field -->
      <div>
        <label for="password" class="text-text-secondary text-xs font-semibold uppercase tracking-wider block mb-1.5">
          Mot de passe
        </label>
        <div class="relative">
          <dx-text-box
            id="password"
            [mode]="showPassword ? 'text' : 'password'"
            formControlName="password"
            stylingMode="outlined"
            placeholder="••••••••"
            
           [elementAttr]="{ class: isFieldInvalid('password') ? 'auth-input auth-input-error pr-12' : 'auth-input pr-12' }"
            [isValid]="!isFieldInvalid('password')">
          </dx-text-box>

          <!-- Password toggle button -->
          <button type="button"
                  (click)="togglePassword()"
                  class="absolute right-3 top-1/2 -translate-y-1/2 text-text-secondary hover:text-text transition-colors bg-transparent border-0 cursor-pointer p-1 z-10"
                  aria-label="Toggle password visibility">
            <svg *ngIf="!showPassword" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
            <svg *ngIf="showPassword" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
            </svg>
          </button>
        </div>
        <span *ngIf="isFieldInvalid('password')" class="text-error text-xs mt-1 block">
          {{ getFieldError('password') }}
        </span>
      </div>

      <!-- Remember Me & Forgot Password -->
      <div class="flex justify-between items-center mt-1 text-sm">
        <dx-check-box
          formControlName="rememberMe"
          text="Se souvenir de moi"
          class="auth-checkbox">
        </dx-check-box>
        <a routerLink="/forgot-password" class="text-primary hover:text-primary-hover transition-colors">
          Mot de passe oublié ?
        </a>
      </div>

      <!-- Submit Button -->
      <dx-button
        text="Se connecter →"
        type="default"
        stylingMode="contained"
        width="100%"
        height="48"
        cssClass="auth-submit-btn"
        [disabled]="loginForm.invalid || isLoading"
        [useSubmitBehavior]="true">
        <div *dxTemplate="let data of 'content'">
          <span *ngIf="!isLoading">Se connecter →</span>
          <div *ngIf="isLoading" class="animate-spin h-5 w-5 border-2 border-white border-t-transparent rounded-full mx-auto"></div>
        </div>
      </dx-button>

    </form>

    <!-- Alternative Action / Divider -->
    <div class="relative flex py-4 items-center mt-6">
      <div class="flex-grow border-t border-border/50"></div>
      <span class="flex-shrink mx-4 text-text-secondary text-sm">ou</span>
      <div class="flex-grow border-t border-border/50"></div>
    </div>

    <p class="text-center text-text-secondary text-sm">
      Pas encore de compte ?
      <a routerLink="/register" class="text-primary hover:text-primary-hover font-medium transition-colors">
        Créer un compte
      </a>
    </p>
  </div>

  <!-- Footer Links -->
  <div class="absolute bottom-6 left-0 w-full text-center">
    <p class="text-text-secondary text-xs tracking-wide">
      Confidentialité · Conditions · Support
    </p>
  </div>
</div>
